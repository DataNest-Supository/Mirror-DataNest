            fi
            echo "Mirror production authority remains false; canonical promotion is separate and human-governed."
          } >> "$GITHUB_STEP_SUMMARY"
\n\n'"The bot-owned $BRANCH branch is force-updated to the latest canonical snapshot so there is one current refresh PR instead of a queue of stale SHA-specific PRs."

          EXISTING="$(curl -fsSL             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "$API_URL?state=open&head=DataNest-Supository:$BRANCH&base=main")"

          if [ "$(printf '%s' "$EXISTING" | jq 'length')" -gt 0 ]; then
