            echo "Closed superseded bot refresh PR #$pr_number"
          done

      - name: Refresh summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Canonical refresh"
            echo "- Canonical SHA: ${{ steps.compare.outputs.canonical_sha }}"
            echo "- Mirror SHA before refresh: ${{ steps.compare.outputs.mirror_sha }}"
            echo "- Refresh required: ${{ steps.compare.outputs.changed }}"
            if [ -n "${{ steps.pr.outputs.url }}" ]; then
              echo "- Current refresh PR: ${{ steps.pr.outputs.url }}"
            fi
            echo "Mirror production authority remains false; canonical promotion is separate and human-governed."
          } >> "$GITHUB_STEP_SUMMARY"
\n'"- Mirror main at refresh: $MIRROR_SHA"

          EXISTING="$(curl -fsSL             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "$API_URL?state=open&head=DataNest-Supository:$BRANCH&base=main")"

          if [ "$(printf '%s' "$EXISTING" | jq 'length')" -gt 0 ]; then
            PR_NUMBER="$(printf '%s' "$EXISTING" | jq -r '.[0].number')"
            jq -n               --arg title "Sync latest canonical DataNest main into R&D mirror"               --arg body "$BODY"               '{title:$title,body:$body}'               | curl -fsSL -X PATCH                 -H "Authorization: Bearer $GITHUB_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "$API_URL/$PR_NUMBER"                 --data-binary @-                 >/tmp/refresh-pr.json
          else
            jq -n               --arg title "Sync latest canonical DataNest main into R&D mirror"               --arg head "$BRANCH"               --arg body "$BODY"               '{title:$title,head:$head,base:"main",body:$body}'               | curl -fsSL -X POST                 -H "Authorization: Bearer $GITHUB_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "$API_URL"                 --data-binary @-                 >/tmp/refresh-pr.json
            PR_NUMBER="$(jq -r '.number' /tmp/refresh-pr.json)"
          fi

          jq -e '.number and .html_url' /tmp/refresh-pr.json >/dev/null
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' /tmp/refresh-pr.json)" >> "$GITHUB_OUTPUT"

      - name: Close superseded bot refresh PRs
        if: steps.compare.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_PR: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/DataNest-Supository/Mirror-DataNest/pulls"
          OPEN_PRS="$(curl -fsSL             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             "$API_URL?state=open&base=main&per_page=100")"

