            jq -n               --arg title "Sync latest canonical DataNest main into R&D mirror"               --arg body "$BODY"               '{title:$title,body:$body}'               | curl -fsSL -X PATCH                 -H "Authorization: Bearer $GITHUB_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "$API_URL/$PR_NUMBER"                 --data-binary @-                 >/tmp/refresh-pr.json
          else
            jq -n               --arg title "Sync latest canonical DataNest main into R&D mirror"               --arg head "$BRANCH"               --arg body "$BODY"               '{title:$title,head:$head,base:"main",body:$body}'               | curl -fsSL -X POST                 -H "Authorization: Bearer $GITHUB_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "$API_URL"                 --data-binary @-                 >/tmp/refresh-pr.json
            PR_NUMBER="$(jq -r '.number' /tmp/refresh-pr.json)"
