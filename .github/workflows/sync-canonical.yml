name: Refresh from Canonical DataNest

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: canonical-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Open mirror refresh PR when canonical main moves
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout mirror main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical DataNest main
        shell: bash
        run: |
          git remote add canonical https://github.com/DataNest-Supository/DataNest.git
          git fetch canonical main --prune

      - name: Compare canonical and mirror
        id: compare
        shell: bash
        run: |
          CANONICAL_SHA="$(git rev-parse canonical/main)"
          MIRROR_SHA="$(git rev-parse origin/main)"
          echo "canonical_sha=$CANONICAL_SHA" >> "$GITHUB_OUTPUT"
          echo "mirror_sha=$MIRROR_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$CANONICAL_SHA" "$MIRROR_SHA"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Canonical main is already contained in Mirror main."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare canonical refresh branch
        if: steps.compare.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_SHA="$(git rev-parse canonical/main)"
          SHORT_SHA="$(printf '%s' "$CANONICAL_SHA" | cut -c1-12)"
          BRANCH="sync/canonical-main-$SHORT_SHA"
          git checkout -B "$BRANCH" canonical/main

          # Canonical provides the application baseline, but Mirror owns its
          # workflow surface. Remove canonical-only workflow files before push
          # so the GitHub App never attempts to create/update workflows it
          # does not own and therefore does not need the workflows permission.
          git checkout origin/main -- .github/workflows
          while IFS= read -r workflow_file; do
            if ! git ls-tree -r --name-only origin/main -- .github/workflows | grep -Fxq "$workflow_file"; then
              git rm -f "$workflow_file"
            fi
          done < <(git ls-files .github/workflows)

          git add .github/workflows
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Preserve Mirror-owned Actions workflows"
          fi
          git push --force-with-lease origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create mirror refresh PR
        if: steps.compare.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="sync/canonical-main-$(git rev-parse canonical/main | cut -c1-12)"
          API_URL="https://api.github.com/repos/DataNest-Supository/Mirror-DataNest/pulls"
          EXISTING="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL?state=open&head=DataNest-Supository:$BRANCH&base=main")"
          if [ "$(printf '%s' "$EXISTING" | jq 'length')" -gt 0 ]; then
            echo "Refresh PR already exists for $BRANCH"
            exit 0
          fi
          jq -n \
            --arg title "Sync canonical DataNest main into R&D mirror" \
            --arg head "$BRANCH" \
            --arg body "Canonical DataNest/main moved. This refreshes the R&D baseline only; Mirror-owned Actions workflows remain authoritative for Mirror execution and Pages publication." \
            '{title:$title, head:$head, base:"main", body:$body}' \
            | curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL" \
              --data-binary @- \
              | tee /tmp/create-pr-response.json \
              | jq -e '.number and .html_url'
