name: Mirror Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mirror production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATANEST_STATIC_EXPORT: "true"
      NEXT_PUBLIC_BASE_PATH: "/Mirror-DataNest"
      NEXT_PUBLIC_SUPABASE_URL: "https://qchttpcyqlqnhvahprhz.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_spZZYssbgfnC0qecAPLPVQ_ZqAyugqS"
      DATANEST_SUPABASE_PROJECT: "qchttpcyqlqnhvahprhz"
      DATANEST_UI_RELEASE_SHA: ${{ github.sha }}
      DATANEST_UI_RELEASE_STATE: "candidate"
      NEXT_PUBLIC_DATANEST_MIRROR_RD_MODE: "true"
      MIRROR_PUBLIC_URL: "https://datanest-supository.github.io/Mirror-DataNest/"
      DATANEST_EDGE_AI: datanest-ai-chat@2
      DATANEST_EDGE_INTAKE: datanest-ai-intake@1
      DATANEST_EDGE_CERTIFICATION: datanest-ai-certification@1
      DATANEST_EDGE_PROVIDER: manage-ai-provider-v2@1
      DATANEST_EDGE_INVITES: send-job-invite@1
      DATANEST_EDGE_PROJECT_INVITES: send-project-member-invite@3
      DATANEST_EDGE_RONSAS_STATUS: ronsas-status@1
      DATANEST_EDGE_EXTERNAL_AUDIT: external-audit@1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/node-project-setup

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: node scripts/mirror-test-suite.mjs

      - name: Type check
        id: type_check
        continue-on-error: true
        run: npm run check

      - name: Dependency audit
        id: dependency_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Record pre-release observations
        if: always()
        run: echo "Mirror pre-release observations are advisory and do not block the Mirror production deployment."

      - name: Validate isolated production Supabase runtime values
        env:
          SUPABASE_URL: "https://qchttpcyqlqnhvahprhz.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_spZZYssbgfnC0qecAPLPVQ_ZqAyugqS"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          case "$SUPABASE_URL" in
            https://qchttpcyqlqnhvahprhz.supabase.co) ;;
            *) echo "::error::Mirror must use its dedicated isolated production Supabase project."; exit 1 ;;
          esac
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "::error::Mirror requires a Supabase publishable key."; exit 1 ;;
          esac

      - name: Write isolated production runtime configuration
        env:
          SUPABASE_URL: "https://qchttpcyqlqnhvahprhz.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_spZZYssbgfnC0qecAPLPVQ_ZqAyugqS"
        run: node scripts/write-runtime-config.mjs public/runtime-config.js

      - name: Validate generated Supabase runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s public/runtime-config.js
          grep -Fq 'https://qchttpcyqlqnhvahprhz.supabase.co' public/runtime-config.js
          grep -Fq 'sb_publishable_' public/runtime-config.js
          grep -Fq 'releaseSha' public/runtime-config.js
          grep -Fq "$GITHUB_SHA" public/runtime-config.js


      - name: Write production release manifestoduction release manifest
        env:
          DATANEST_RELEASE_SHA: ${{ github.sha }}
          DATANEST_DB_RELEASE: "mirror-production-current"
          DATANEST_SUPABASE_PROJECT: "qchttpcyqlqnhvahprhz"
        run: node scripts/write-release-manifest.mjs public/release-manifest.json

      - name: Write immutable Mirror release manifest
        shell: bash
        env:
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          DEP_AUDIT: ${{ steps.dependency_audit.outcome }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          release_id="mirror-${GITHUB_RUN_NUMBER}-$short_sha"
          jq -n \
            --arg schemaVersion "mirror-live-release-v1" \
            --arg mode "production" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg releaseId "$release_id" \
            --arg publicUrl "$MIRROR_PUBLIC_URL" \
            --arg canonicalRepository "DataNest-Supository/DataNest" \
            --arg canonicalPublicUrl "https://datanest-supository.github.io/DataNest/" \
            --arg backendProject "qchttpcyqlqnhvahprhz" \
            --arg backendMode "isolated-production" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg unitTests "$UNIT_TESTS" \
            --arg typeCheck "$TYPE_CHECK" \
            --arg dependencyAudit "$DEP_AUDIT" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion:$schemaVersion,
              mode:$mode,
              repository:$repository,
              commit:$commit,
              releaseId:$releaseId,
              publicUrl:$publicUrl,
              canonicalRepository:$canonicalRepository,
              canonicalPublicUrl:$canonicalPublicUrl,
              backend:{project:$backendProject,mode:$backendMode},
              observations:{unitTests:$unitTests,typeCheck:$typeCheck,dependencyAudit:$dependencyAudit},
              workflowRun:$workflowRun,
              authority:{productionSource:true,productionDeployment:true,productionBackend:true,canonicalDeployment:false,governance:false},
              evidencePurpose:"Production release evidence for the exact Mirror surface; canonical certification remains separate.",
              generatedAt:$generatedAt
            }' > public/mirror-release.json

          cat > public/mirror-rd.json <<EOF
          {"ok":true,"mode":"production","repository":"DataNest-Supository/Mirror-DataNest","commit":"$GITHUB_SHA","releaseId":"$release_id","canonicalRepository":"DataNest-Supository/DataNest","backend":"Mirror DataNest isolated production","supabaseProject":"qchttpcyqlqnhvahprhz","productionAuthority":true}
          EOF

      - name: Build static Mirror production site
        run: npm run build

      - name: Build DataNest-hosted RONSAS production apps
        run: node scripts/build-ronsas-pages.mjs

      - name: Validate complete Mirror production artifact
        run: node scripts/validate-mirror-artifact.mjs out

      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ./out

  deploy:
    name: Publish live Mirror production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy live Mirror production
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  verify-live:
    name: Verify live Mirror production
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: deploy
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/node-project-setup

      - name: Verify live release manifest and static routes
        id: live_routes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://datanest-supository.github.io/Mirror-DataNest"
          fetch_after_pages_propagation() {
            local url="$1"
            local output="$2"
            local attempts=18
            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-all-errors "$url" -o "$output"; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep 5
              fi
            done
            echo "::error::Mirror Pages resource did not become reachable after Pages propagation retries: $url"
            return 1
          }

          fetch_until_expected() {
            local url="$1"
            local output="$2"
            local expected="$3"
            local attempts=18
            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-all-errors "$url" -o "$output" &&
                 grep -Fq "$expected" "$output"; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep 5
              fi
            done
            echo "::error::Mirror Pages resource did not expose the expected production content after propagation retries: $url"
            return 1
          }

          fetch_until_json_value() {
            local url="$1"
            local output="$2"
            local filter="$3"
            local expected="$4"
            local attempts=36
            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-all-errors "$url" -o "$output" &&
                 jq -e --arg expected "$expected" "$filter" "$output" >/dev/null; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep 5
              fi
            done
            echo "::error::Mirror Pages JSON resource did not expose the expected production value after propagation retries: $url"
            return 1
          }

          fetch_until_json_value "$base/mirror-release.json" /tmp/mirror-release.json '.commit == $expected' "$GITHUB_SHA"
          fetch_until_json_value "$base/release-manifest.json" /tmp/release-manifest.json '.frontendCommit == $expected' "$GITHUB_SHA"
          jq -e '.supabaseProject == "qchttpcyqlqnhvahprhz" and .edgeFunctions.projectInvitations == "send-project-member-invite@3"' /tmp/release-manifest.json >/dev/null
          jq -e '.backend.project == "qchttpcyqlqnhvahprhz" and .backend.mode == "isolated-production" and .authority.productionSource == true and .authority.productionDeployment == true and .authority.productionBackend == true and .authority.canonicalDeployment == false' /tmp/mirror-release.json >/dev/null
          # GitHub Pages serves the static shell/manifests here; application route reachability
          # is verified by the live Playwright suite below. Do not require every client-side
          # route or app path to exist as a standalone server resource.
          fetch_after_pages_propagation "$base/" /tmp/mirror-home.html
          grep -qi "<html" /tmp/mirror-home.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live visual and functional browser tests
        id: browser_tests
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://datanest-supository.github.io
          DATANEST_APP_PATH: /Mirror-DataNest/
          MIRROR_EXPECTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/browser-results.json
        run: >
          npx playwright test
          tests/browser/auth.smoke.spec.ts
          tests/browser/legal-centre.spec.ts
          tests/browser/mirror-rd-live.spec.ts
          tests/browser/mirror-workspace-access.spec.ts
          --reporter=list,html,json

      - name: Write live Mirror verification evidence
        if: always()
        shell: bash
        env:
          ROUTE_OUTCOME: ${{ steps.live_routes.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: |
          jq -n \
            --arg schemaVersion "mirror-live-verification-v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg liveUrl "https://datanest-supository.github.io/Mirror-DataNest/" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg routeOutcome "$ROUTE_OUTCOME" \
            --arg browserOutcome "$BROWSER_OUTCOME" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion:$schemaVersion,
              repository:$repository,
              commit:$commit,
              liveUrl:$liveUrl,
              workflowRun:$workflowRun,
              visualFunctionalEvidence:{routeVerification:$routeOutcome,browserTests:$browserOutcome},
              authority:{productionAuthority:true,certification:false,canonicalDeployment:false},
              generatedAt:$generatedAt
            }' > mirror-live-verification.json

      - name: Upload Mirror governance evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mirror-live-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            mirror-live-verification.json
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 90

      - name: Record live verification result without deployment gating
        if: always()
        env:
          ROUTE_OUTCOME: ${{ steps.live_routes.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: |
          {
            echo "## Mirror live verification"
            echo "- Commit: $GITHUB_SHA"
            echo "- Live routes: $ROUTE_OUTCOME"
            echo "- Browser tests: $BROWSER_OUTCOME"
            echo "Mirror production evidence is authoritative for the Mirror surface; canonical `/DataNest/` release requires separate canonical review."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ROUTE_OUTCOME" != success ] || [ "$BROWSER_OUTCOME" != success ]; then
            echo "::warning::Mirror production deployment has unsuccessful live observations. Inspect the evidence artifact before canonical handoff."
          fi
