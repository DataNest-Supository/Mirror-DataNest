name: Mirror R&D Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mirror-rd-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build ungated R&D preview
    runs-on: ubuntu-24.04
    env:
      DATANEST_STATIC_EXPORT: "true"
      NEXT_PUBLIC_BASE_PATH: "/Mirror-DataNest"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.MIRROR_SUPABASE_URL || 'https://mirror-datanest.invalid' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MIRROR_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_mirror_placeholder' }}
      DATANEST_UI_RELEASE_SHA: ${{ github.sha }}
      DATANEST_UI_RELEASE_STATE: "mirror_rd_test"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/node-project-setup

      - name: Advisory tests
        continue-on-error: true
        run: npm test

      - name: Advisory type check
        continue-on-error: true
        run: npm run check

      - name: Write isolated mirror runtime configuration
        env:
          SUPABASE_URL: ${{ vars.MIRROR_SUPABASE_URL || 'https://mirror-datanest.invalid' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.MIRROR_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_mirror_placeholder' }}
        run: node scripts/write-runtime-config.mjs public/runtime-config.js

      - name: Write mirror identity marker
        shell: bash
        run: |
          cat > public/mirror-rd.json <<EOF
          {"ok":true,"mode":"mirror-rd-test","repository":"DataNest-Supository/Mirror-DataNest","commit":"$GITHUB_SHA","canonicalRepository":"DataNest-Supository/DataNest","productionAuthority":false}
          EOF

      - name: Build static preview
        run: npm run build

      - name: Build DataNest-hosted RONSAS apps
        run: node scripts/build-ronsas-pages.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./out

  deploy:
    name: Publish R&D preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy mirror preview
        id: deployment
        uses: actions/deploy-pages@v5.0.1
