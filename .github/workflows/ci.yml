name: Mirror R&D Observations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-rd-observations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observations:
    name: Non-blocking R&D observations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/node-project-setup

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: node scripts/mirror-test-suite.mjs

      - name: Governance control effectiveness contract
        id: control_monitor
        continue-on-error: true
        run: node --test --experimental-strip-types tests/unit/governance-control-effectiveness-monitoring.test.mjs

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run check

      - name: Production dependency audit
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Validate RONSAS imports
        id: imports
        continue-on-error: true
        run: node scripts/validate-ronsas-imports.mjs

      - name: Record R&D observations
        if: always()
        shell: bash
        run: |
          {
            echo "## MIRROR-DATANEST R&D observations"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Unit tests: \`${{ steps.tests.outcome }}\`"
            echo "- Governance contract: \`${{ steps.control_monitor.outcome }}\`"
            echo "- Type check: \`${{ steps.typecheck.outcome }}\`"
            echo "- Dependency audit: \`${{ steps.audit.outcome }}\`"
            echo "- RONSAS imports: \`${{ steps.imports.outcome }}\`"
            echo
            echo "These observations are advisory in Mirror R&D Test Mode."
            echo "Promotion to DataNest remains subject to canonical human review."
          } >> "$GITHUB_STEP_SUMMARY"
