name: Mirror BOTSQUAD Feed

on:
  schedule:
    - cron: "29 */6 * * *"
      timezone: Africa/Johannesburg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-botsquad-inbox
  cancel-in-progress: true

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consume canonical BOTSQUAD UX/function feed
        run: node scripts/botsquad-feed-consumer.mjs
      - name: Publish isolated Mirror BOTSQUAD inbox
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f botsquad/inbox/latest.json ]; then
            echo "Canonical BOTSQUAD feed has not been generated yet."
            exit 0
          fi
          branch="automation/botsquad-inbox"
          git fetch origin "$branch" || true
          git switch -C "$branch"
          git add botsquad/inbox/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh Mirror BOTSQUAD inbox"
          git push --force-with-lease origin "HEAD:$branch"
