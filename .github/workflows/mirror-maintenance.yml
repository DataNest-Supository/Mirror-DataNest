name: Mirror Maintenance

on:
  schedule:
    - cron: "7 3 * * *"
      timezone: Africa/Johannesburg
    - cron: "47 4 * * 0"
      timezone: Africa/Johannesburg
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task
        type: choice
        required: true
        default: all
        options: [all, branch-cleaner, streamliner]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mirror-maintenance
  cancel-in-progress: false

jobs:
  branch-cleaner:
    if: github.event_name == 'schedule' && github.event.schedule == '7 3 * * *' || github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'branch-cleaner')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safe autonomous branch cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/branch-cleaner.mjs --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-branch-cleaner-${{ github.run_id }}
          path: artifacts/branch-cleaner/
          retention-days: 30

  streamliner:
    if: github.event_name == 'schedule' && github.event.schedule == '47 4 * * 0' || github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'streamliner')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe deterministic refinements
        run: node scripts/workflow-reviewer.mjs --apply
      - name: Open Mirror maintenance PR when tracked files changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo "No tracked safe refinements."
            exit 0
          fi
          branch="maintenance/mirror-streamline-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -m "chore: scheduled Mirror streamlining"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Scheduled Mirror streamlining" --body "Automated byte-safe text normalization only; no canonical authority is implied."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-streamliner-${{ github.run_id }}
          path: artifacts/workflow-reviewer/
          retention-days: 30
